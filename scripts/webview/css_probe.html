<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Probe</title>
<style>
body{font-family:sans-serif;padding:16px;font-size:20px}
#hasbox{width:100%;height:90px;background:#c00;color:#fff;font-size:26px;line-height:90px;text-align:center}
#hasbox:has(> span){background:#0a0}
#ar{width:100%;aspect-ratio:3/1;background:#04f;color:#fff;font-size:24px;line-height:60px;text-align:center}
#cg{width:100%;height:90px;background:conic-gradient(#f00,#0f0,#00f,#f00);margin-top:12px}
#flex{display:flex;gap:20px;margin-top:12px}
#flex div{flex:1;height:60px;background:#666;color:#fff;text-align:center;line-height:60px}
</style></head><body>
<div id="hasbox"><span>x</span>has() OK (green)</div>
<div id="ar">aspect-ratio 3/1</div>
<div id="cg"></div>
<div id="flex"><div>gap</div><div>gap</div><div>gap</div></div>
</body></html>
